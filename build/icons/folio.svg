<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- folio: a leaf of a book with its letter, on the platform's rounded square. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#6a3fe0"/>
    </linearGradient>
    <!-- In the canvas' units: a gradient by the shape's box would draw nothing on a horizontal bar. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="730">
      <stop offset="0" stop-color="#4f6cf5"/>
      <stop offset="1" stop-color="#5a3ad6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b0f5c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- The page, its top right corner folded. -->
  <path d="M302 236 H612 L724 348 V786 Q724 806 704 806 H322 Q302 806 302 786 Z" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M612 236 V328 Q612 348 632 348 H724 Z" fill="#d9defb"/>
  <!-- The letter: a stem hooked at the top, a bar across. -->
  <path d="M454 712 V444 Q454 360 538 360 H566" fill="none" stroke="url(#ink)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M384 490 H560" fill="none" stroke="url(#ink)" stroke-width="58" stroke-linecap="round"/>
</svg>
