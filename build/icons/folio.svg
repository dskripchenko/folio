<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- folio: an open book — text on one page, a diagram on the other — and its ribbon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a08a"/>
      <stop offset="1" stop-color="#0b5566"/>
    </linearGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="512" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe5d0"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="512" y1="0" x2="788" y2="0">
      <stop offset="0" stop-color="#e9dfc8"/>
      <stop offset="1" stop-color="#fdf7ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#06303a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- The pages beneath: the book's thickness. -->
    <path d="M512 356 C440 316 320 314 236 344 V752 C320 724 440 726 512 768 C584 726 704 724 788 752 V344 C704 314 584 316 512 356 Z" fill="#d8c7a2"/>
    <path d="M512 332 C440 292 320 290 236 320 V728 C320 700 440 702 512 744 Z" fill="url(#left)"/>
    <path d="M512 332 C584 292 704 290 788 320 V728 C704 700 584 702 512 744 Z" fill="url(#right)"/>
  </g>
  <!-- Text on the left page. -->
  <g stroke="#8fb3ad" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M290 410 C350 396 410 398 462 416"/>
    <path d="M290 470 C350 456 410 458 462 476"/>
    <path d="M290 530 C350 516 410 518 462 536"/>
    <path d="M290 590 C330 581 370 581 400 588"/>
  </g>
  <!-- A diagram on the right page. -->
  <g stroke="#14806f" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M628 440 L726 440"/>
    <path d="M628 440 L677 560"/>
    <path d="M726 440 L677 560"/>
  </g>
  <circle cx="628" cy="440" r="30" fill="#14806f"/>
  <circle cx="726" cy="440" r="30" fill="#ff7a59"/>
  <circle cx="677" cy="560" r="30" fill="#14806f"/>
  <!-- The ribbon. -->
  <path d="M530 300 H570 V486 L550 466 L530 486 Z" fill="#ff7a59"/>
</svg>
