<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Scripts only from folio itself. Pictures, media and requests may name the
       web: the main process decides whether they go (the network consent). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>folio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" data-testid="sidebar" aria-label="Workspace"></aside>
  <div class="resizer" aria-hidden="true"></div>
  <div class="main">
  <header class="bar">
    <nav class="tabs" role="tablist" data-testid="tabs"></nav>
    <button type="button" class="toggle-edit" data-testid="toggle-edit" hidden></button>
    <button type="button" class="open" data-testid="open" data-i18n="open"></button>
  </header>
  <div class="banner" role="alert" data-testid="net-banner" hidden>
    <span class="banner-text"></span>
    <button type="button" data-scope="file" data-i18n="allowFile"></button>
    <button type="button" data-scope="folder" data-i18n="allowFolder"></button>
  </div>
  <div class="notice" role="alert" data-testid="notice" hidden>
    <span class="notice-text"></span>
    <button type="button" data-action="disk" data-i18n="takeDisk"></button>
    <button type="button" data-action="mine" data-i18n="keepMine"></button>
  </div>
  <main class="view" data-testid="view">
    <section class="welcome" data-testid="welcome">
      <h1>folio</h1>
      <p data-i18n="welcome"></p>
    </section>
  </main>
  </div>
  <script src="vendor/embed.bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
