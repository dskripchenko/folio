name: tests

# Every change on the three systems folio is for: lint, types, unit tests,
# then the built app is started and looked at (Playwright drives Electron).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The PDF tests read what was exported with poppler (pdftotext, pdfinfo).
      - name: poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: The app starts and opens its window (Linux, a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          FOLIO_REQUIRE_POPPLER: '1'
      - name: The app starts and opens its window
        if: runner.os != 'Linux'
        run: pnpm test:e2e
        env:
          FOLIO_REQUIRE_POPPLER: ${{ runner.os == 'macOS' && '1' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: test-results
